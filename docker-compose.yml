# Docker Compose — StudySync
# Sobe os 3 serviços: banco, backend e frontend
# Uso: docker-compose up --build

services:
  # ==============================
  # Banco de Dados PostgreSQL
  # ==============================
  db:
    image: postgres:16-alpine
    container_name: studysync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studysync
      # Senha vem do .env (ver .env.example); o valor padrão é só pra desenvolvimento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studysync123}
      POSTGRES_DB: studysync
    ports:
      # Só a própria máquina acessa o banco (não a rede)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysync"]
      interval: 3s
      timeout: 5s
      retries: 10

  # ==============================
  # Backend — Node.js + Fastify
  # ==============================
  backend:
    build: ./backend
    container_name: studysync-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://studysync:${POSTGRES_PASSWORD:-studysync123}@db:5432/studysync
      PORT: 3000
      NODE_ENV: development
      # Segredo p/ assinar os tokens de login. Vem do .env; o padrão é só de
      # desenvolvimento — defina um valor forte e privado antes de qualquer deploy.
      JWT_SECRET: ${JWT_SECRET:-studysync-dev-secret-troque-em-producao}
      # Opcionais: sem elas, o job de notificações roda normal só sem enviar
      # e-mail de verdade (fallback já testado). Vêm de um `.env` na raiz
      # (não versionado) — ver `.env.example`.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ==============================
  # Frontend — React + Vite
  # ==============================
  frontend:
    build: ./frontend
    container_name: studysync-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
